name: Build

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Restore extension key
        if: ${{ secrets.EXTENSION_KEY != '' }}
        shell: bash
        run: echo "${{ secrets.EXTENSION_KEY }}" | base64 -d > extension-key.pem

      - name: Build extension
        run: bun run build:crx

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: atarashii-new-tab.crx,atarashii-new-tab.zip
          immutableCreate: true
